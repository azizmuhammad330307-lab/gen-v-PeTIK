<!DOCTYPE html>
<html lang="id">
<head>

</head>
<body>
    <h1>Tugas JavaScript Yang Ke 3</h1>
    <p>Silakan buka menu Console di Chrome untuk melihat hasilnya :>.</p>

    <script>
        // 1. Membuat Biodata Sederhana
        let nama = "Muhammad Aziz";
        let umur = 20;
        let isSiswa = true;

        console.log(nama);
        console.log(umur);

        console.log(nilai);

        nilai = 85;
        console.log(nilai);
    </script>
