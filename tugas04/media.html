<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media And Layout</title>
    <link rel="icon" type="image/x-icon" href="../logo1.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ---------- Token desain ---------- */
        :root {
            --ink: #0b0d18;
            --panel: rgba(20, 22, 40, 0.62);
            --garis: rgba(255, 255, 255, 0.1);
            --teks: #f1f1f6;
            --teks-redup: #aeb0c4;
            --aksen: #ff5c7a;

            --font-judul: "Bricolage Grotesque", "Segoe UI", Arial, sans-serif;
            --font-isi: "Figtree", "Segoe UI", Arial, sans-serif;
            --font-kode: ui-monospace, "Cascadia Code", Consolas, monospace;

            --r-panel: 20px;
            --r-media: 14px;
            --r-kecil: 8px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark; /* kontrol audio/video ikut tema gelap */
        }

        body {
            margin: 0;
            padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 40px) 64px;
            font-family: var(--font-isi);
            font-size: 1rem;
            line-height: 1.65;
            color: var(--teks);
            background-color: var(--ink);
        }

        /* Gambar latar tetap, digelapkan supaya konten mudah dibaca */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(11, 13, 24, 0.7), rgba(11, 13, 24, 0.94)),
                url("assets/Jougamon_new_century3.png") center / cover no-repeat;
        }

        .wadah {
            max-width: 1080px;
            margin: 0 auto;
            display: grid;
            gap: clamp(28px, 4vw, 44px);
        }

        /* ---------- Hero ---------- */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            gap: clamp(24px, 5vw, 56px);
            align-items: center;
            animation: muncul 0.7s ease-out both;
        }

        .hero-teks h1 {
            margin: 0 0 16px;
            font-family: var(--font-judul);
            font-size: clamp(2.5rem, 6vw, 4.25rem);
            font-weight: 800;
            line-height: 1.02;
            letter-spacing: -0.03em;
        }

        .hero-teks p {
            margin: 0 0 24px;
            max-width: 40ch;
            color: var(--teks-redup);
            font-size: 1.1rem;
        }

        .elemen {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .elemen code {
            display: inline-block;
            padding: 3px 11px;
            font-family: var(--font-kode);
            font-size: 0.85rem;
            color: var(--aksen);
            border: 1px solid rgba(255, 92, 122, 0.45);
            border-radius: 999px;
        }

        .hero-gambar {
            margin: 0;
        }

        .hero-gambar img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: var(--r-panel);
            border: 1px solid var(--garis);
            box-shadow: 0 28px 70px -28px rgba(255, 92, 122, 0.5);
        }

        .hero-gambar figcaption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--teks-redup);
        }

        /* ---------- Panel (audio & video) ---------- */
        .panel {
            padding: clamp(18px, 3vw, 28px);
            background: var(--panel);
            border: 1px solid var(--garis);
            border-radius: var(--r-panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .panel h2 {
            margin: 0;
            font-family: var(--font-judul);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .panel-audio {
            display: grid;
            grid-template-columns: minmax(180px, 0.6fr) 1.4fr;
            gap: 20px 32px;
            align-items: center;
        }

        .judul-lagu {
            margin: 4px 0 0;
            color: var(--teks-redup);
        }

        audio {
            display: block;
            width: 100%;
        }

        .panel-video h2 {
            margin-bottom: 18px;
        }

        .grid-video {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-video figure {
            margin: 0;
        }

        .grid-video figcaption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--teks-redup);
        }

        .bingkai {
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            border-radius: var(--r-media);
            border: 1px solid var(--garis);
        }

        .bingkai video,
        .bingkai iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
        }

        /* ---------- Animasi masuk (sekali, hanya hero) ---------- */
        @keyframes muncul {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero { animation: none; }
        }

        /* ---------- Responsif ---------- */
        @media (max-width: 820px) {
            .hero,
            .panel-audio,
            .grid-video {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="wadah">

        <header class="hero">
            <div class="hero-teks">
                <h1>Media And Layout</h1>
                <p>Gambar, audio, dan video yang ditata dalam satu halaman, dibuat dengan HTML dan CSS.</p>
                <ul class="elemen" aria-label="Elemen HTML yang dipakai">
                    <li><code>&lt;img&gt;</code></li>
                    <li><code>&lt;audio&gt;</code></li>
                    <li><code>&lt;video&gt;</code></li>
                    <li><code>&lt;iframe&gt;</code></li>
                </ul>
            </div>

            <figure class="hero-gambar">
                <img src="assets/Jougamon_new_century3.png" alt="Ilustrasi Jougamon New Century">
                <figcaption>Jougamon New Century</figcaption>
            </figure>
        </header>

        <main class="wadah">
            <section class="panel panel-audio" aria-labelledby="judul-audio">
                <div>
                    <h2 id="judul-audio">Audio</h2>
                    <p class="judul-lagu">07. Ascension to Heaven</p>
                </div>
                <audio controls preload="metadata">
                    <source src="assets/07.%20Ascension%20to%20Heaven.mp3" type="audio/mpeg">
                    Browser kamu tidak mendukung elemen audio.
                </audio>
            </section>

            <section class="panel panel-video" aria-labelledby="judul-video">
                <h2 id="judul-video">Video</h2>
                <div class="grid-video">
                    <figure>
                        <div class="bingkai">
                            <video controls preload="metadata">
                                <source src="assets/rossi-redhood-arknights-endfield-moewalls-com.mp4" type="video/mp4">
                                Browser kamu tidak mendukung elemen video.
                            </video>
                        </div>
                        <figcaption>Rossi Redhood – Arknights: Endfield (file lokal)</figcaption>
                    </figure>

                    <figure>
                        <div class="bingkai">
                            <iframe
                                src="https://www.youtube-nocookie.com/embed/l5F5YBKEceM?si=4_q4b1MCxo00ZFEQ"
                                title="YouTube video player"
                                loading="lazy"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen></iframe>
                        </div>
                        <figcaption>Video YouTube (embed)</figcaption>
                    </figure>
                </div>
            </section>
        </main>

    </div>
</body>
</html>
